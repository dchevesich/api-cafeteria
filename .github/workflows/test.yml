name: Tests CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Configura PostgreSQL como servicio
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_cafeteria_test
        ports:
          - 5432:5432
        # Espera hasta que PostgreSQL esté listo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Correr migraciones en DB de test
      - name: Correr migraciones
        env:
          NODE_ENV: test
        run: npx knex migrate:latest --env test --knexfile knexfile.js

      # 5. Ejecutar tests
      - name: Ejecutar tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
        run: npm test
